name: Sky Recon quality gate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  verify:
    strategy:
      matrix:
        python: ["3.10", "3.12"]
    runs-on: ubuntu-latest
    steps:
      - name: Fetch source
        uses: actions/checkout@v4
      - name: Select Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - name: Install package and checks
        run: python -m pip install --disable-pip-version-check ".[test]"
      - name: Exercise unit suite
        run: python -m pytest
